name: Update metadata
on:
  schedule:
    - cron: 0 */2 * * *
  workflow_dispatch:

env:
  LEGENDARY_CONFIG_PATH: /tmp/legendary

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version-check.outputs.version }}
    permissions:
      contents: read

    steps:
      - name: Get current date
        id: get-date
        run: |
          echo "date=$(/bin/date -u "+%Y-%m-%d")" >> $GITHUB_OUTPUT
          echo "time=$(/bin/date -u "+%H_%M")" >> $GITHUB_OUTPUT
        shell: bash

      - name: Configure legendary credentials cache
        uses: actions/cache@v4
        with:
          # TODO: replace with { env.LEGENDARY_CONFIG_PATH } ?
          path: /tmp/legendary/user.json
          key: legendary-data-${{ steps.get-date.outputs.date }}
          restore-keys: |
            legendary-data-
      
      - name: Account credentials check
        run: |
          if [ ! -f /tmp/legendary/user.json ]; then
            exit 1
          fi

      - name: Download legendary
        run: |
          wget -O legendary https://github.com/derrod/legendary/releases/latest/download/legendary
          chmod +x legendary

      - name: Get latest version info
        run: |
          ./legendary info Sugar > /tmp/rocket_league_info
          cat /tmp/rocket_league_info

      - name: Configure Rocket League version cache
        id: version-cache
        uses: actions/cache@v4
        with:
          path: /tmp/rocket_league_info
          key: game-version-${{ hashFiles('/tmp/rocket_league_info') }}

      - name: Trigger metadata update
        id: version-check
        if: steps.version-cache.outputs.cache-hit != 'true'

        run: |
          LATEST_VERSION=$(./legendary info Sugar | grep "Latest version: " | sed -n -e 's/^.*Latest version: //p')
          if [ -z "$LATEST_VERSION" ]; then
              echo "Failed to get new version id!"
              exit 1
          fi
          echo "New version: $LATEST_VERSION"
          echo "version=$LATEST_VERSION" >> $GITHUB_OUTPUT

  update:
    runs-on: ubuntu-latest
    needs: check
    if: ${{ needs.check.outputs.version != '' }}
    permissions:
      contents: write

    steps:
      - name: Get current date
        id: get-date
        run: |
          echo "date=$(/bin/date -u "+%Y-%m-%d")" >> $GITHUB_OUTPUT
          echo "time=$(/bin/date -u "+%H_%M")" >> $GITHUB_OUTPUT
        shell: bash

      - name: Configure legendary credentials cache
        uses: actions/cache@v4
        with:
          # TODO: replace with { env.LEGENDARY_CONFIG_PATH } ?
          path: /tmp/legendary/user.json
          key: legendary-data-${{ steps.get-date.outputs.date }}
          restore-keys: |
            legendary-data-
      
      - name: Account credentials check
        run: |
          if [ ! -f /tmp/legendary/user.json ]; then
            exit 1
          fi

      - name: Download legendary
        run: |
          wget -O legendary https://github.com/derrod/legendary/releases/latest/download/legendary
          chmod +x legendary

      - name: Download Rocket League
        run: |
          mkdir rocketleague
          ./legendary install --download-only --skip-dlcs --disable-delta-manifests --base-path "/tmp" --game-folder 'rocketleague' --prefix 'binaries' --prefix 'tagame/legal' --yes Sugar

      - name: Pull repository
        uses: actions/checkout@v4

      - name: Pull previous data
        uses: actions/checkout@v4
        with:
          ref: 'data'
          path: 'data'

      - name: Run metadata update
        id: metadata-update
        run: |
          chmod +x ./update-metadata.sh
          ./update-metadata.sh

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          cwd: './data'
          message: 'Rocket League "${{ needs.check.outputs.version }}"'
          default_author: github_actions
          tag: 'build/${{ steps.metadata-update.outputs.build_id }}'